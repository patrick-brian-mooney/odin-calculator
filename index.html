<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <script src="calculator.js" defer></script>

    <div id="main">
        <div id="calc-body">
            <p id="calc-display">0</p>
            <div id="calc-buttons">
                <div class="button-row">
                    <button onclick="doClear();">Clear</button>
                    <button onclick="setOperator('^');">x<sup>y</sup></button>
                    <button onclick="setOperator('√');"><sup>y</sup>√x</button>
                    <button onclick="setOperator('log');">log<sub>y</sub> x</button>
                </div>
                <div class="button-row">
                    <button onclick="entryButton(7);">7</button>
                    <button onclick="entryButton(8);">8</button>
                    <button onclick="entryButton(9);">9</button>
                    <button onclick="setOperator('/');">/</button>
                </div>
                <div class="button-row">
                    <button onclick="entryButton(4);">4</button>
                    <button onclick="entryButton(5);">5</button>
                    <button onclick="entryButton(6);">6</button>
                    <button onclick="setOperator('*');">*</button>
                </div>
                <div class="button-row">
                    <button onclick="entryButton(1);">1</button>
                    <button onclick="entryButton(2);">2</button>
                    <button onclick="entryButton(3);">3</button>
                    <button onclick="setOperator('-');">-</button>
                </div>
                <div class="button-row">
                    <button onclick="entryButton(0);">0</button>
                    <button onclick="entryButton('.');">.</button>
                    <button onclick="doEquals();">=</button>
                    <button onclick="setOperator('+');">+</button>
                </div>
            </div>
        </div>
    </div>

    <footer>Calculator created for <a rel="muse" href="https://www.theodinproject.com/lessons/foundations-calculator">an assignment</a> from <a rel="muse" href="https://www.theodinproject.com/">The Odin Project</a>. GPL v3+-licensed code available <a rel="me" href="https://github.com/patrick-brian-mooney/odin-calculator">on GitHub</a>.</footer>
</body>
</html>
