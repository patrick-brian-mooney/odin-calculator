<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <script src="calculator.js" defer></script>

    <div id="calc-body">
        <p id="calc-display">0</p>
        <div id="calc-buttons">
            <div class="button-row"><button>Clear</button> <button>x<sup>y</sup></button> <button><sup>x</sup>√y</button> <button>log<sub>y</sub> x</button></div>
            <div class="button-row"><button>7</button> <button>8</button> <button>9</button> <button>/</button></div>
            <div class="button-row"><button>4</button> <button>5</button> <button>6</button> <button>*</button></div>
            <div class="button-row"><button>1</button> <button>2</button> <button>3</button> <button>-</button></div>
            <div class="button-row"><button>0</button> <button>.</button> <button>=</button> <button>+</button></div>
        </div>
    </div>

    <footer>Calculator created for <a rel="muse" href="https://www.theodinproject.com/lessons/foundations-calculator">an assignment</a> from <a rel="muse" href="https://www.theodinproject.com/">The Odin Project</a>. GPL v3+-licensed code available on GitHub.</footer>
</body>
</html>
